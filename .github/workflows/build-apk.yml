name: CI / Build APK / AAB

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ─────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ── Gradle ───────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-scan-publish: false

      - name: Regenerate wrapper JAR
        working-directory: android
        run: gradle wrapper --gradle-version=8.9

      # ── Config files ──────────────────────────────────────────────────────
      - name: Create google-services.json placeholder
        working-directory: android/app
        run: |
          cat > google-services.json << 'JSON'
          {
            "project_info": { "project_id": "aiworkpay-placeholder" },
            "client": [],
            "configuration_version": "1"
          }
          JSON

      - name: Write local.properties
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ── SDK licenses ──────────────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Build phases ──────────────────────────────────────────────────────
      - name: Phase 1 — Generate build config
        working-directory: android
        run: ./gradlew generateDebugBuildConfig --build-cache --no-daemon

      - name: Phase 2 — Kotlin compilation
        working-directory: android
        run: ./gradlew compileDebugKotlin --build-cache --no-daemon

      - name: Phase 3 — AAPT2 resource linking
        working-directory: android
        run: ./gradlew processDebugResources --build-cache --no-daemon

      - name: Phase 4 — Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload debug APK ──────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aiworkpay-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # ── Release keystore ──────────────────────────────────────────────────
      - name: Generate CI keystore
        run: |
          keytool -genkeypair \
            -alias aiworkpay \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android/app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'ci-store-pass' }}" \
            -keypass  "${{ secrets.KEY_PASSWORD      || 'ci-key-pass'   }}" \
            -dname "CN=Aiworkpay CI, OU=CI, O=Aiworkpay, L=Paris, S=IDF, C=FR" \
            -noprompt
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ci-store-pass' }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD      || 'ci-key-pass'   }}

      # ── Signed release APK ────────────────────────────────────────────────
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH:     keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ci-store-pass' }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS         || 'aiworkpay'     }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD      || 'ci-key-pass'   }}

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: aiworkpay-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── Release AAB (Play Store) ──────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_PATH:     keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ci-store-pass' }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS         || 'aiworkpay'     }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD      || 'ci-key-pass'   }}

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aiworkpay-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
