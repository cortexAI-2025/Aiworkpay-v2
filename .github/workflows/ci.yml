name: CI / Build & Deploy

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    env:
      # Minimal env vars needed to pass build without real secrets
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/aiworkpay?schema=public
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-placeholder-secret-min-32-chars-ok
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GITHUB_CLIENT_ID: placeholder
      GITHUB_CLIENT_SECRET: placeholder
      FACEBOOK_CLIENT_ID: placeholder
      FACEBOOK_CLIENT_SECRET: placeholder
      APPLE_CLIENT_ID: placeholder
      APPLE_CLIENT_SECRET: placeholder
      # Email / admin — not required for build, gracefully absent at runtime
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: noreply@aiworkpay.fr
      CONTACT_EMAIL: contact@aiworkpay.fr
      ADMIN_EMAILS: admin@aiworkpay.fr
      ADMIN_SETUP_TOKEN: ci-admin-setup-token-placeholder

    steps:
      # ── Phase 1 — Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Phase 2 — Node.js setup ───────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Phase 3 — Install dependencies ────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Phase 4 — Generate Prisma client ──────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      # ── Phase 5 — TypeScript check ────────────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── Phase 6 — ESLint ──────────────────────────────────────────────────
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Payment lifecycle tests
        run: npm test

      # ── Phase 7 — Next.js production build ───────────────────────────────
      - name: Build production bundle
        run: npm run build

      # ── Phase 8 — Upload build artefact ──────────────────────────────────
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/
            public/
            package.json
            package-lock.json
            prisma/
            next.config.mjs
          retention-days: 7
          if-no-files-found: error
