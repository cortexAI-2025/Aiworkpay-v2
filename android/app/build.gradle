plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read signing credentials from keystore.properties written by CI
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.aiworkpay.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.aiworkpay.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // Production URL loaded by the WebView
        buildConfigField "String", "APP_URL", "\"https://aiworkpay.com\""
    }

    signingConfigs {
        release {
            storeFile     file(keystoreProps['storeFile']     ?: 'keystore.jks')
            storePassword (keystoreProps['storePassword']     ?: '')
            keyAlias      (keystoreProps['keyAlias']          ?: '')
            keyPassword   (keystoreProps['keyPassword']       ?: '')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Splash screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // WebKit (modern WebView)
    implementation 'androidx.webkit:webkit:1.12.1'
}
